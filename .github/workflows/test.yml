name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - releases/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v1
        with:
          node-version: 12.x
      - uses: actions/checkout@v2

      - name: Setup PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm test
      - name: Verify no unstaged changes
        run: __test__/verify-no-unstaged-changes.sh

      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation

  test:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}

    steps:
      # Clone this repo
      - name: Checkout
        uses: actions/checkout@v2

      # PMG ships Linux (x86_64/arm64) binaries only, so the macOS and Windows
      # legs skip it. This job installs no packages - PMG is wired in for
      # uniform coverage, not because there is anything here to guard.
      - name: Setup PMG proxy
        if: runner.os == 'Linux'
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      # Keep git/LFS/submodule traffic off the MITM proxy. Ubuntu's git links
      # against libcurl3-gnutls, which ignores SSL_CERT_FILE, so a proxied
      # clone can fail certificate verification even though npm and curl are
      # fine. Nothing is lost by exempting these hosts: this job installs no
      # packages, so no package traffic is being waived. localhost is exempted
      # so `pmg proxy stop` can reach its own daemon.
      - name: Exempt git traffic from the PMG proxy
        if: runner.os == 'Linux'
        run: |
          hosts="github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,raw.githubusercontent.com,github-cloud.s3.amazonaws.com,localhost,127.0.0.1"
          echo "NO_PROXY=$hosts" >> "$GITHUB_ENV"
          echo "no_proxy=$hosts" >> "$GITHUB_ENV"

      # Basic checkout
      - name: Checkout basic
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        shell: bash
        run: __test__/verify-basic.sh

      # Clean
      - name: Modify work tree
        shell: bash
        run: __test__/modify-work-tree.sh
      - name: Checkout clean
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify clean
        shell: bash
        run: __test__/verify-clean.sh

      # Side by side
      - name: Checkout side by side 1
        uses: ./
        with:
          ref: test-data/v2/side-by-side-1
          path: side-by-side-1
      - name: Checkout side by side 2
        uses: ./
        with:
          ref: test-data/v2/side-by-side-2
          path: side-by-side-2
      - name: Verify side by side
        shell: bash
        run: __test__/verify-side-by-side.sh

      # LFS
      - name: Checkout LFS
        uses: ./
        with:
          repository: actions/checkout # hardcoded, otherwise doesn't work from a fork
          ref: test-data/v2/lfs
          path: lfs
          lfs: true
      - name: Verify LFS
        shell: bash
        run: __test__/verify-lfs.sh

      # Submodules false
      - name: Checkout submodules false
        uses: ./
        with:
          ref: test-data/v2/submodule-ssh-url
          path: submodules-false
      - name: Verify submodules false
        run: __test__/verify-submodules-false.sh

      # Submodules one level
      - name: Checkout submodules true
        uses: ./
        with:
          ref: test-data/v2/submodule-ssh-url
          path: submodules-true
          submodules: true
      - name: Verify submodules true
        run: __test__/verify-submodules-true.sh

      # Submodules recursive
      - name: Checkout submodules recursive
        uses: ./
        with:
          ref: test-data/v2/submodule-ssh-url
          path: submodules-recursive
          submodules: recursive
      - name: Verify submodules recursive
        run: __test__/verify-submodules-recursive.sh

      # Basic checkout using REST API
      - name: Remove basic
        if: runner.os != 'windows'
        run: rm -rf basic
      - name: Remove basic (Windows)
        if: runner.os == 'windows'
        shell: cmd
        run: rmdir /s /q basic
      - name: Override git version
        if: runner.os != 'windows'
        run: __test__/override-git-version.sh
      - name: Override git version (Windows)
        if: runner.os == 'windows'
        run: __test__\\override-git-version.cmd
      - name: Checkout basic using REST API
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        run: __test__/verify-basic.sh --archive

      - name: Enforce PMG policy
        if: always() && runner.os == 'Linux'
        run: pmg proxy stop --fail-on-violation

  test-proxy:
    runs-on: ubuntu-latest
    container:
      image: alpine/git:latest
      options: --dns 127.0.0.1
    services:
      squid-proxy:
        image: datadog/squid:latest
        ports:
          - 3128:3128
    env:
      https_proxy: http://squid-proxy:3128
    steps:
      # Clone this repo
      - name: Checkout
        uses: actions/checkout@v2

      # This job runs inside alpine/git (musl, no bash), so the PMG composite
      # action may not be able to install or execute. continue-on-error keeps
      # that from failing the job - PMG is attempted here, and the job proceeds
      # unchanged whether or not it comes up.
      - name: Setup PMG proxy
        id: pmg
        continue-on-error: true
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      # This job exists to prove checkout works through the squid service, so
      # squid must stay the effective proxy. PMG exports its own proxy vars via
      # GITHUB_ENV, and the precedence between GITHUB_ENV and this job's
      # `env:` block is not something the GitHub docs state outright - so pin
      # BOTH spellings back to squid explicitly. That is correct either way,
      # and does not depend on which one wins.
      - name: Restore squid as the effective proxy
        if: always()
        run: |
          echo "HTTPS_PROXY=http://squid-proxy:3128" >> "$GITHUB_ENV"
          echo "https_proxy=http://squid-proxy:3128" >> "$GITHUB_ENV"
          echo "NO_PROXY=localhost,127.0.0.1" >> "$GITHUB_ENV"
          echo "no_proxy=localhost,127.0.0.1" >> "$GITHUB_ENV"

      # Basic checkout using git
      - name: Checkout basic
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        run: __test__/verify-basic.sh

      # Basic checkout using REST API
      - name: Remove basic
        run: rm -rf basic
      - name: Override git version
        run: __test__/override-git-version.sh
      - name: Basic checkout using REST API
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        run: __test__/verify-basic.sh --archive

      # Tolerant teardown: pmg may never have installed in this container.
      # No packages are installed in this job, so there is no violation to
      # enforce - this exists to stop the daemon if it did come up.
      - name: Enforce PMG policy
        if: always()
        continue-on-error: true
        run: |
          if command -v pmg >/dev/null 2>&1; then
            pmg proxy stop --fail-on-violation
          else
            echo "pmg not available in this container - nothing to stop"
          fi

  test-bypass-proxy:
    runs-on: ubuntu-latest
    env:
      https_proxy: http://no-such-proxy:3128
      no_proxy: api.github.com,github.com
    steps:
      # Clone this repo
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      # This job asserts that checkout still works when https_proxy points at a
      # proxy that does not exist and no_proxy exempts GitHub. PMG exports its
      # own proxy vars, which would quietly make the broken proxy reachable and
      # void the assertion - so pin the deliberately-broken values back, in both
      # spellings, regardless of which source wins precedence. The
      # only addition is localhost, so `pmg proxy stop` can reach its daemon;
      # that does not weaken the GitHub bypass being tested.
      - name: Restore the deliberately-broken proxy settings
        run: |
          echo "HTTPS_PROXY=http://no-such-proxy:3128" >> "$GITHUB_ENV"
          echo "https_proxy=http://no-such-proxy:3128" >> "$GITHUB_ENV"
          echo "NO_PROXY=api.github.com,github.com,localhost,127.0.0.1" >> "$GITHUB_ENV"
          echo "no_proxy=api.github.com,github.com,localhost,127.0.0.1" >> "$GITHUB_ENV"

      # Basic checkout using git
      - name: Checkout basic
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        run: __test__/verify-basic.sh
      - name: Remove basic
        run: rm -rf basic

      # Basic checkout using REST API
      - name: Override git version
        run: __test__/override-git-version.sh
      - name: Checkout basic using REST API
        uses: ./
        with:
          ref: test-data/v2/basic
          path: basic
      - name: Verify basic
        run: __test__/verify-basic.sh --archive

      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
